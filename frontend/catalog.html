<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Instrumen - MeteoLab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-dot"></span>MeteoLab</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="catalog.html" aria-current="page">Katalog</a></li>
        <li><a href="network-map.html">Peta jaringan</a></li>
        <li><a href="borrowing.html">Pinjam</a></li>
        <li><a href="returning.html">Kembalikan</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div class="container">
        <h1>Katalog instrumen</h1>
        <p>Setiap baris adalah satu unit alat dengan kode sendiri.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="filters">
          <div>
            <label for="search">Cari instrumen</label>
            <input type="search" id="search" placeholder="Nama, kode, atau merek">
          </div>
          <div>
            <label for="status-filter">Status</label>
            <select id="status-filter">
              <option value="all">Semua status</option>
              <option value="available">Tersedia</option>
              <option value="borrowed">Dipinjam</option>
              <option value="maintenance">Perawatan</option>
              <option value="deployed">Terpasang di stasiun</option>
            </select>
          </div>
        </div>

        <div class="chips" id="category-chips" role="group" aria-label="Filter kategori"></div>

        <div class="result-bar">
          <span id="result-count" aria-live="polite"></span>
          <button type="button" class="link-btn" id="reset-filter">Hapus filter</button>
        </div>

        <div class="instrument-grid" id="catalog-grid">
          <p class="state-msg">Memuat instrumen...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p><strong>MeteoLab</strong><br>Laboratorium Meteorologi</p>
      <p>Kontak pengelola: <a href="mailto:lab@example.ac.id">lab@example.ac.id</a><br>Jam layanan: Senin-Jumat, 08.00-16.00</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
